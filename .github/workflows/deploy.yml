name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY }}
          # Finché non c'è il dominio il sito è su https://mariobruz.github.io/aclawfirm-site/
          # Con il dominio: impostare le variabili SITE_URL=https://www.aclawfirm.eu e BASE_PATH=/
          SITE_URL: ${{ vars.SITE_URL || 'https://mariobruz.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/aclawfirm-site/' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
